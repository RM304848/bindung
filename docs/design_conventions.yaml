# Wie die Oberflaeche aussieht und sich verhaelt -- an einer Stelle.
#
# VOR JEDER AENDERUNG an bindung/web/vorlagen oder statisch/stil.css hier
# nachschlagen. Eine neue Seite, ein neues Feld, ein neuer Hinweis: erst
# nachsehen, wie es die anderen tun, dann bauen. Wer eine neue Konvention
# einfuehrt, traegt sie hier ein -- sonst ist sie beim naechsten Mal wieder
# eine Ausnahme.
#
# Jede Regel hat einen Grund. Wo sie sich maschinell pruefen laesst, steht die
# Pruefung dabei, und tests/test_design.py fuehrt sie aus. `ausnahmen` sind
# bekannte Altlasten, keine Erlaubnis: sie stehen unter `offen` und werden
# weniger, nicht mehr.

regeln:

  # ------------------------------------------------------------ Farben

  - id: farben-nur-als-variablen
    regel: >
      Farben stehen im Stylesheet nur als Variablen in den `:root`-Bloecken
      (`--grund`, `--text`, `--akzent` ...). Jede andere Regel schreibt
      `var(--...)`, keine Hex-, rgb()- oder hsl()-Farbe.
    warum: >
      Hell und dunkel sind zwei Belegungen derselben Namen. Eine Farbe, die
      ausserhalb steht, bleibt im anderen Thema stehen -- weisser Text auf
      weissem Grund, ohne dass ein Test rot wird.
    pruefung:
      art: css_farben_nur_in_wurzel

  - id: hell-und-dunkel-gleich-belegt
    regel: >
      Der helle und der dunkle `:root`-Block (`prefers-color-scheme: dark`)
      definieren dieselben Farbvariablen, und jede benutzte `var(--...)` ist
      irgendwo definiert.
    warum: >
      Eine Variable, die nur hell existiert, faellt im dunklen Thema auf den
      Browser-Vorgabewert zurueck; eine Tippfehler-Variable macht still gar
      nichts.
    pruefung:
      art: paletten_gleich

  - id: keine-inline-stile
    regel: >
      Vorlagen haben kein `style="..."`, keinen `<style>`-Block und keine
      Farbwerte. Aussehen steht in stil.css.
    warum: >
      Ein Inline-Stil umgeht die Palette und damit das dunkle Thema, und er
      laesst sich nicht an einer Stelle aendern.
    pruefung:
      art: vorlagen_verbieten
      muster: ['\sstyle\s*=', '<style', '#[0-9a-fA-F]{6}\b', '#[0-9a-fA-F]{3}\b(?![-\w])',
               '\brgba?\(', '\bhsla?\(']
      ausnahmen: []

  # ------------------------------------------------------------ Eingaben

  - id: jedes-feld-hat-eine-beschriftung
    regel: >
      Jedes Eingabefeld (`input` ausser `hidden`, `select`, `textarea`) hat ein
      `<label for="...">`, einen umschliessenden `<label>` oder ein
      `aria-label`. Ist die Beschriftung sichtbar ueberfluessig (Suchfeld),
      steht sie als `nur-lesegeraet`.
    warum: >
      Ohne Beschriftung liest ein Bildschirmleser nur "Eingabefeld", und auf
      dem Telefon verschwindet der Platzhalter beim Tippen.
    pruefung:
      art: felder_mit_beschriftung

  # -------------------------------------------------------------- Sprache

  - id: nur-deutsch
    regel: >
      Alles, was der Nutzer liest -- Text, Platzhalter, `aria-label`, `title`
      --, ist deutsch und benutzt die Begriffe aus CONTEXT.md. Die Seite
      traegt `lang="de"`.
    warum: >
      Zwei Sprachen in einer Oberflaeche lesen sich wie ein Fehler, und die
      Begriffe aus CONTEXT.md sind der Grund, warum Code und Oberflaeche
      dasselbe meinen. Geprueft wird gegen eine Liste englischer Knopfwoerter.
    pruefung:
      art: nur_deutsch
      verboten: [Save, Cancel, Delete, Remove, Settings, Login, Log in, Logout, Log out,
                 Sign in, Sign out, Password, Username, Search, Add, Edit, Submit, Close,
                 Loading, Error, Home, Contacts, Contact, Back, Next]
      ausnahmen: []

  - id: seite-ist-deutsch-ausgezeichnet
    regel: Jede Seite beginnt mit `<html lang="de">` und hat den Viewport `width=device-width`.
    warum: >
      Silbentrennung, Vorlesen und die Schrift der Zeichen haengen an `lang`;
      ohne Viewport rendert das Telefon eine verkleinerte Desktop-Seite.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/vorlagen/basis.html
      muster: ['<html lang="de">', 'width=device-width']

  # ------------------------------------------------------------ Bedienung

  - id: beruehrziele-44
    regel: >
      Knoepfe, Eintraege, Karten und Eingabefelder sind mindestens 44 px hoch
      (`min-height: var(--ziel)`, `--ziel: 44px`).
    warum: >
      Die App wird auf dem iPhone benutzt, mit dem Daumen, im Gehen. Kleinere
      Ziele trifft man nicht, und ein falscher Tipp auf "Kontakt eintragen"
      speichert Unsinn.
    pruefung:
      art: beruehrziele
      selektoren: ['.knopf', '.eintrag', '.karte', '.zeile', '.kreis-knopf', '.zurueck',
                   '.option', '.chip-wahl span', '.segment span', '.kontaktlinks a', 'input[type="text"]',
                   'input[type="tel"]', 'input[type="date"]', 'input[type="number"]',
                   'input[type="time"]', 'input[type="password"]',
                   'input[type="search"]',
                   'select', 'textarea', '.diktat-knopf']

  - id: kein-cdn
    regel: >
      Weder Vorlagen noch Stylesheet laden etwas aus dem Netz. HTMX liegt in
      `statisch/`.
    warum: >
      Die Daten bleiben auf dem eigenen Server; ein Skript von fremder Adresse
      sieht jede Seite mit, und die App soll ohne Internet laufen.
    pruefung:
      art: vorlagen_verbieten
      auch_css: true
      muster: ['https?://', 'src="//', 'href="//']
      ausnahmen: []

  # --------------------------------------------------------- Teilaktualisierung

  - id: teile-tragen-ihre-kennung
    regel: >
      Jeder Teil, den HTMX tauscht (Seitenleiste, Liste, Karten, Listenkoerper,
      Personenseite, Tag-Auswahl, Kontaktlinks, Speicherstatus, Faelligkeit,
      Angehoerige, Stichtage),
      beginnt mit
      einem Element, das seine eigene `id` traegt und bei Bedarf
      `hx-swap-oob="true"` bekommt (je Teil eine eigene Variable `oob_...`,
      nie eine gemeinsame, weil Teile ineinander eingebunden werden).
    warum: >
      Eine Antwort tauscht mehrere Spalten auf einmal. Ohne feste `id` weiss
      HTMX nicht, was gemeint ist, und eine gemeinsame `oob`-Variable wuerde
      beim Einbinden auch die inneren Teile ausserhalb tauschen.
    pruefung:
      art: datei_enthaelt
      dateien: [bindung/web/vorlagen/_seitenleiste.html, bindung/web/vorlagen/_liste.html,
                bindung/web/vorlagen/_listenkoerper.html, bindung/web/vorlagen/_pane.html,
                bindung/web/vorlagen/_personentags.html,
                bindung/web/vorlagen/_kontaktlinks.html,
                bindung/web/vorlagen/_speicherstatus.html,
                bindung/web/vorlagen/_karten.html,
                bindung/web/vorlagen/_faelligkeit.html,
                bindung/web/vorlagen/_angehoerige.html,
                bindung/web/vorlagen/_stichtage.html]
      muster: ['\bid="[a-z-]+"', 'hx-swap-oob="true"']

  - id: speichern-beim-verlassen
    regel: >
      Felder der Personenseite haben keinen Speichern-Knopf: das Formular
      speichert bei `change` (Verlassen des Feldes, Enter) und meldet
      „Gespeichert“. Ein abgelehnter Wert kommt als 422 mit Meldung und ersetzt
      die Seite durch den gespeicherten Stand (`HX-Retarget`).
    warum: >
      „Alles bearbeitet sich inline“ (PLAN.md, Abschnitt 7): nach dem Telefonat
      Notiz tippen, Feld verlassen, fertig. Ein Knopf, den man vergisst,
      verliert die Notiz.

  - id: textfelder-tragen-den-diktat-haken
    regel: Jedes `<textarea>` traegt das Attribut `data-diktat`.
    warum: >
      WP6 haengt den Mikrofonknopf an diesen Haken; fehlt er, ist ein
      Notizfeld still ohne Diktat, und keiner merkt es.
    pruefung:
      art: textarea_mit_attribut
      attribut: data-diktat

  - id: auf-dem-telefon-eine-spalte
    regel: >
      Unter 768 px ist genau eine Spalte offen: `data-ansicht` am `.app`
      (`seitenleiste`, `liste`, `person`) bestimmt sie. Der Server schreibt sie
      beim Laden und schickt bei jeder Teilantwort `HX-Trigger: {"spalte": ...}`;
      `bindung.js` setzt sie. Jede Spalte ausser der ersten hat einen
      Zurueck-Pfeil (`data-zeige`).
    warum: >
      Drei Spalten passen nicht auf ein Telefon, und untereinander gestapelt
      wuerde man auf der Suche nach der Person scrollen. So wie Erinnerungen
      auf dem iPhone: eine Ebene, ein Pfeil zurueck.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/statisch/stil.css
      muster: ['max-width: 767px', '\.app\[data-ansicht="person"\]', 'display: none']

  - id: chips-sind-kontrollkaestchen
    regel: >
      Tags zum An- und Abwaehlen sind `<label class="chip-wahl">` um ein
      Kontrollkaestchen und einen `<span>`; die Optik haengt am
      `input:checked + span`.
    warum: >
      Ein echtes Kontrollkaestchen funktioniert mit Tastatur, Bildschirmleser
      und ohne Skript; das Label macht den ganzen Chip zum 44-px-Ziel.

  # ------------------------------------------------- Kontakte und Karten

  - id: karten-sind-links-mit-adresse
    regel: >
      Eine Karte ist ein `<a class="karte ...">` mit `href` (die Ansicht mit
      `?karte=...`) und `hx-get` auf `/liste`. Die aktive Karte traegt
      `karte-aktiv` und `aria-current="true"`; ihr Link fuehrt zur Liste ohne
      Karte zurueck. Die Karte steht in der Adresse, nicht im Skript.
    warum: >
      Der Zustand der Ansicht lebt in der Adresse (Neuladen, Zurueck-Taste,
      ein Lesezeichen auf „Erkaltet“). Ein Knopf mit verstecktem Zustand haette
      nichts davon, und ein zweiter Klick auf dieselbe Karte soll sie wieder
      loesen, wie bei den Filtern in Erinnerungen.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/vorlagen/_karten.html
      muster: ['<a class="karte', 'href="\{\{ ziel\.url\(\) \}\}"',
               'hx-get="\{\{ ziel\.url\(\x27/liste\x27\) \}\}"', 'karte-aktiv',
               'aria-current="true"']

  - id: kreis-ist-ein-knopf-neben-der-zeile
    regel: >
      Der Kreis vor einer Person ist ein eigener `<button class="kreis-knopf">`
      neben dem Link der Zeile, nie darin; er oeffnet „Kontakt eintragen“ und
      traegt ein `aria-label` mit dem Namen. Seine Farbe nennt den Zustand
      (ueberfaellig, erkaltet, bald), die Plakette rechts nennt ihn mit Worten.
    warum: >
      Ein Knopf in einem Link ist ungueltiges HTML und trifft auf dem Telefon
      mal das eine, mal das andere. Und Farbe allein sagt es Menschen mit
      Rot-Gruen-Schwaeche nicht; das Wort steht immer dabei.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/vorlagen/_zeile.html
      muster: ['<button type="button" class="kreis-knopf"', 'aria-label="Kontakt eintragen',
               'plakette plakette-']

  - id: segmente-sind-optionsfelder
    regel: >
      Eine Auswahl aus wenigen Moeglichkeiten (Art eines Kontakts) sind
      `<label class="segment">` um ein Optionsfeld (`type="radio"`) und einen
      `<span>`; die Optik haengt am `input:checked + span`. Die Gruppe hat ein
      `<legend>`.
    warum: >
      Wie bei den Chips: ein echtes Optionsfeld funktioniert mit Tastatur,
      Bildschirmleser und ohne Skript, und genau eines ist immer gewaehlt. Ein
      Auswahlmenue haette fuer fuenf Moeglichkeiten einen Tipp zu viel, den
      man nach dem Telefonat nicht machen will.
    pruefung:
      art: datei_enthaelt
      dateien: [bindung/web/vorlagen/_kontakt_blatt.html, bindung/web/statisch/stil.css]
      muster: ['class="segment"|\.segment input:checked \+ span']

  - id: blatt-ueber-der-seite
    regel: >
      „Kontakt eintragen“ ist ein Blatt ueber der Personenseite:
      `<div class="ueberzug" data-blatt role="dialog" aria-modal="true">` mit
      einem Formular darin; mittig auf dem Mac, am unteren Rand auf dem Telefon.
      „Abbrechen“ (`data-schliessen`), Escape und ein Klick daneben schliessen
      es ohne den Server, Speichern tauscht die Personenseite.
    warum: >
      Nach einem Anruf soll man die Notiz tippen und sofort weg sein; das Blatt
      lenkt nicht auf eine andere Seite und laesst die Person dahinter sehen.
      Nichts ist gespeichert, solange es offen ist, also braucht das Schliessen
      keine Antwort vom Server.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/vorlagen/_kontakt_blatt.html
      muster: ['class="ueberzug" data-blatt role="dialog" aria-modal="true"',
               'data-schliessen', '<legend>Art</legend>']

  - id: zustand-hat-eine-farbe-und-ein-wort
    regel: >
      Jeder Zustand hat eine Palettenfarbe (`--aufmerksamkeit`, `--erkaltet`,
      `--woche`, sonst `--text-leise`) und steht immer auch als Wort da
      (Plakette, Personenseite). Die Farben gehoeren zu den Karten: ueberfaellig
      = Aufmerksamkeit, erkaltet = Erkaltet, bald = Diese Woche.
    warum: >
      Wer die drei Karten kennt, erkennt die Zeilen wieder; und eine Farbe ohne
      Wort ist nur fuer die lesbar, die sie unterscheiden koennen.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/statisch/stil.css
      muster: ['\.plakette-ueberfaellig \{ color: var\(--aufmerksamkeit\)',
               '\.plakette-erkaltet \{ color: var\(--erkaltet\)',
               '\.plakette-bald \{ color: var\(--woche\)']

  - id: kartennamen-brechen-nicht-um-silben
    regel: >
      Die Namen der Karten werden nicht getrennt (`hyphens: none`); wird es
      eng, schrumpft die Schrift (Container-Abfrage auf `.karten`), das Wort
      bleibt ganz. Umbenennen ist keine Loesung.
    warum: >
      „Aufmerksam-keit“ sieht auf 375 px wie ein Fehler aus. Die Breite der
      Mittelspalte, nicht des Fensters, entscheidet, wie viel Platz ein Name
      hat, deshalb eine Container-Abfrage.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/statisch/stil.css
      muster: ['container-type: inline-size', '@container \(max-width', 'hyphens: none']

  # ------------------------------------------- Angehoerige und Stichtage

  - id: abschnitte-der-personenseite-sind-gleich-gebaut
    regel: >
      Angehoerige und Stichtage sind Abschnitte der Personenseite
      (`<section class="personenabschnitt">` mit Zwischentitel, einer Liste von
      Posten und einem aufklappbaren Formular `<details class="hinzufuegen">`).
      Hinzufuegen ist ein Formular, das zu ist, bis man es braucht; Bearbeiten
      tauscht einen Posten gegen ein Formular an Ort und Stelle; Loeschen und
      Verknuepfung loesen fragen vorher (`hx-confirm`) und nennen, was mit
      verschwindet. Jede Aenderung zeichnet beide Abschnitte neu.
    warum: >
      Die Personenseite soll wie ein Blatt Papier lesbar bleiben: was
      eingetragen ist, steht da, und das Eintragen nimmt keinen Platz weg, bis man
      es will. Beide Abschnitte haengen aneinander (der Geburtstag eines Kindes
      ist ein Stichtag der Eltern), deshalb darf keiner veraltet stehen
      bleiben. Dass Loeschen mehr als eine Zeile trifft (Gegenstueck, Stichtag),
      sieht man dem Knopf nicht an, also sagt es die Rueckfrage.
    pruefung:
      art: datei_enthaelt
      dateien: [bindung/web/vorlagen/_angehoerige.html, bindung/web/vorlagen/_stichtage.html]
      muster: ['<section id="[a-z]+" class="personenabschnitt"', '<details class="hinzufuegen"',
               'class="posten-liste"']

  - id: datum-in-drei-feldern
    regel: >
      Ein Datum, dessen Jahr fehlen darf (Geburtstag, Stichtag), steht in drei
      Feldern Tag, Monat (Auswahl mit Namen) und Jahr (leer erlaubt), gemeinsam
      in `<fieldset class="gruppe datumsfelder">` mit einer `<legend>`; das
      Makro `datumsfelder` in `_makros.html` baut sie. Angezeigt wird es
      ausgeschrieben: „24. März“, „24. März 1986“.
    warum: >
      Das Datumsfeld des Browsers kennt kein Datum ohne Jahr, und „--03-24“
      tippt niemand. Drei Felder erzwingen nichts, was man nicht weiss, und der
      Monat mit Namen verhindert den Dreher zwischen Tag und Monat.
    pruefung:
      art: datei_enthaelt
      dateien: [bindung/web/vorlagen/_makros.html]
      muster: ['macro datumsfelder', '<fieldset class="gruppe datumsfelder">',
               'name="tag"', 'name="monat"', 'name="jahr"']

  - id: verknuepfen-ist-eine-suche-mit-optionsfeldern
    regel: >
      Eine Person aus der App auszuwaehlen ist ein Suchfeld
      (`type="search"`, `data-ohne-enter`) und darunter die Treffer als
      Optionsfelder (`_kandidaten.html`), hoechstens acht, nie die ganze Liste;
      ohne Suchtext steht ein Hinweis statt Treffern. Das Suchfeld liegt im
      Formular, Enter schickt es nicht ab.
    warum: >
      Es gibt Hunderte Personen; ein Auswahlmenue mit allen waere auf dem
      Telefon unbenutzbar. Optionsfelder sind echte Bedienelemente (Tastatur,
      Bildschirmleser), und Enter im Suchfeld soll die Suche beenden, nicht
      einen halb ausgefuellten Angehoerigen speichern.
    pruefung:
      art: datei_enthaelt
      dateien: [bindung/web/vorlagen/_kandidaten.html, bindung/web/vorlagen/_angehoerige.html,
                bindung/web/statisch/bindung.js]
      muster: ['type="radio" name="verknuepfte_person_id"|data-ohne-enter',
               'Tippe einen Namen|data-ohne-enter']

  - id: zweite-plakette-gehoert-dem-stichtag
    regel: >
      Liegt ein Stichtag im Vorlauf, hat die Zeile eine zweite Plakette
      (`plakette-stichtag`) unter der des Zustands, als kleiner Rahmen in der
      Farbe von „Diese Woche“ (`--woche`). Die Plakette des Zustands bleibt, wie
      sie ist. Der Text nennt Art und Zeit: „Geburtstag in 4 Tagen“, „Jahrestag
      heute“, beim Geburtstag eines Angehoerigen mit dessen Namen.
    warum: >
      Ein Stichtag aendert den Zustand nicht (PLAN.md, Abschnitt 6): wer ueberfaellig
      ist und morgen Geburtstag hat, ist beides. Zwei Plaketten sagen das ehrlich,
      und der Rahmen unterscheidet sie vom Wort des Zustands, das ohne Rahmen
      steht. Die Farbe ist die der Karte, auf die der Stichtag die Person stellt.
    pruefung:
      art: datei_enthaelt
      dateien: [bindung/web/statisch/stil.css, bindung/web/vorlagen/_zeile.html]
      muster: ['\.plakette-stichtag \{[^}]*var\(--woche\)|plakette plakette-stichtag',
               'zeile-plaketten']

  # ------------------------------------------------------- Einstellungen

  - id: einstellungen-abschnitte-mit-eigenem-formular
    regel: >
      Die Einstellungen sind eine eigene Seite (eine Spalte, `.einstellungen`,
      mit „‹ Zurück“ nach `/`), aufgeteilt in Abschnitte
      (`<section class="einstellung">` mit eigener `id`). Jeder Abschnitt hat ein
      eigenes Formular mit eigenem Speichern-Knopf, schickt per `hx-post` nur seine
      Felder, tauscht nur seinen Abschnitt aus (`hx-target` auf die eigene `id`,
      `outerHTML`) und meldet „Gespeichert“ in einem `role="status"`. Eine
      abgelehnte Eingabe kommt als 422 mit Meldung und den eingegebenen Werten
      zurueck (Passwoerter nie).
    warum: >
      Anders als die Personenseite speichert diese Seite nicht beim Verlassen des
      Feldes: ein halb getipptes Passwort oder eine Zeitzone, die man beim
      Durchblaettern der Auswahl streift, darf nicht abgeschickt werden. Getrennte
      Formulare lassen einen abgelehnten Wert nicht die anderen Abschnitte
      zuruecksetzen, und ohne Skript funktionieren dieselben Formulare als
      gewoehnliche Posts (`method` und `action` stehen daneben).
    pruefung:
      art: datei_enthaelt
      dateien: [bindung/web/vorlagen/_einstellung_passwort.html,
                bindung/web/vorlagen/_einstellung_erinnern.html,
                bindung/web/vorlagen/_einstellung_diktat.html]
      muster: ['<section id="einstellung-[a-z]+" class="einstellung"',
               'hx-post="/einstellungen/[a-z]+" hx-target="#einstellung-[a-z]+" hx-swap="outerHTML"',
               'method="post" action="/einstellungen/[a-z]+"',
               'role="status"']

  - id: kalenderadresse-lesen-kopieren-erneuern
    regel: >
      Die Kalenderadresse steht in einem Feld mit `readonly` und einem Knopf
      „Kopieren“ (`data-kopieren="<id des Feldes>"`, von `bindung.js` bedient); sie
      steht zweimal da, als `webcal://` und als `https://` oder `http://` je
      nachdem, wie die Seite erreicht wurde. „Adresse neu erzeugen“ fragt vorher
      (`hx-confirm`) und sagt, dass die alte danach nicht mehr funktioniert und
      der Kalender sie neu bekommen muss. Daneben steht, dass die Adresse geheim zu
      halten ist.
    warum: >
      Die Adresse ist das einzige Geheimnis des Kalenders: wer sie kennt, liest
      Stichtage und Notizen. Ein Feld zum Markieren und ein Knopf zum Kopieren
      verhindern das Abtippen, und die Rueckfrage verhindert, dass ein Fehlklick
      einen Kalender stillegt, der auf dem Telefon abonniert ist.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/vorlagen/_einstellung_kalender.html
      muster: ['readonly', 'data-kopieren="kalender-webcal"', 'hx-confirm="[^"]*funktioniert',
               'Gib sie nicht weiter']

  # --------------------------------------------------- Benachrichtigungen

  - id: hinweis-ist-ein-streifen-ueber-der-app
    regel: >
      Der Hinweis (die Tagesmeldung, wenn dieser Browser keinen Push hat) ist ein
      `<aside id="hinweis" class="hinweis">` ueber `.app`, nicht in einer der drei
      Spalten: eine Zeile mit der Zahl, hoechstens zwei mit den Namen, daneben
      „Benachrichtigungen erlauben“ (`data-push-aktivieren`) und „Heute ausblenden“,
      das `/hinweis/weggeklickt` abschickt und den Streifen durch nichts ersetzt. Er
      ist niedrig: auf dem Telefon stehen die Knoepfe unter dem Text, nicht daneben in
      einer eigenen Reihe darueber. Ein Attribut `hidden` gewinnt immer
      (`[hidden] { display: none !important; }`).
    warum: >
      Auf dem Telefon oeffnet die App auf der Seitenleiste; ein Streifen in der Liste
      sahe man erst nach dem ersten Tippen, und er verschwaende bei jedem Wechsel der
      Liste. Ueber der App steht er bei jedem Wechsel an seinem Platz und schiebt die
      Karten nur um eine Zeile nach unten. Ohne die `hidden`-Regel wuerden die
      `display`-Werte der Klassen das Attribut stillschweigend ueberstimmen und
      Streifen und Knoepfe waeren immer zu sehen.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/vorlagen/_hinweis.html
      muster: ['<aside id="hinweis" class="hinweis"', 'data-push-aktivieren',
               'hx-post="/hinweis/weggeklickt" hx-target="#hinweis" hx-swap="outerHTML"']

  - id: attribut-hidden-gewinnt
    regel: >
      Das Stylesheet hat `[hidden] { display: none !important; }`. Was `bindung.js` ein-
      oder ausblendet, tut es mit dem Attribut `hidden`, nicht mit einem Stil.
    warum: >
      Jede Klasse mit `display: flex` ueberstimmt das Attribut `hidden` still. Ohne die
      Regel waeren Knoepfe und Streifen, die fuer diesen Browser gar nicht gelten, immer
      zu sehen, und kein Test sahe es, weil der Text im HTML steht.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/statisch/stil.css
      muster: ['\[hidden\] \{ display: none !important; \}']

  - id: erlaubnis-fragt-nur-ein-klick
    regel: >
      Die Erlaubnis fuer Mitteilungen wird nur nach einem Klick auf einen Knopf mit
      `data-push-aktivieren` erfragt (`bindung.js`, `pushAktivieren`), nie beim Laden
      einer Seite und nie aus einem anderen Ereignis. Was dieser Browser kann und ob er
      schon angemeldet ist, stellt `bindung.js` fest, ohne zu fragen, und blendet die
      Knoepfe danach ein oder aus.
    warum: >
      Browser verbergen die Erlaubnis nach einem Nein dauerhaft in ihren Einstellungen,
      und Safari verlangt eine Geste. Wer beim Laden fragt, wird beim ersten Besuch
      abgelehnt und ist dann ohne Umweg nicht mehr zu erreichen.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/statisch/bindung.js
      muster: ['function pushAktivieren', 'Notification\.requestPermission\(\)',
               'closest\("\[data-push-aktivieren\]"\)']

  - id: einstellung-benachrichtigungen
    regel: >
      Die Benachrichtigungen sind ein eigener Abschnitt der Einstellungen
      (`<section id="einstellung-benachrichtigungen" class="einstellung">`) unter
      „Erinnern“, ohne Speichern-Knopf: der Status dieses Browsers
      (`data-push-status`) und die Knoepfe „In diesem Browser aktivieren“ und
      „Deaktivieren“ kommen aus `bindung.js`, die Zahl der angemeldeten Browser und die
      „Testmeldung senden“ vom Server. Der Abschnitt tauscht sich selbst aus
      (`outerHTML`), die Testmeldung sagt im Abschnitt, wie sie ausging.
    warum: >
      „Erinnern“ speichert Zahlen mit einem Knopf und tauscht sich beim Speichern aus;
      ein Status, den das Skript eben eingetragen hat, ginge dabei verloren. Und nur
      der Browser weiss, ob er Mitteilungen kann: der Server darf es nicht behaupten.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/vorlagen/_einstellung_benachrichtigungen.html
      muster: ['<section id="einstellung-benachrichtigungen" class="einstellung"',
               'data-push-status', 'data-push-aktivieren', 'data-push-deaktivieren',
               'hx-post="/push/test" hx-target="#einstellung-benachrichtigungen" hx-swap="outerHTML"',
               'Testmeldung senden']

  - id: diktat-knopf-im-rahmen
    regel: >
      Jedes `<textarea data-diktat>` steht in der Vorlage allein in
      `<div class="diktat">`. Den Mikrofonknopf (`.diktat-knopf`, rund, 44 px, rechts
      in einem Streifen unter dem Feld, links daneben der Zwischentext) setzt `bindung.js`
      in diesen Rahmen, nur wenn `Diktat.verfuegbar()` stimmt; was HTMX spaeter einsetzt,
      bekommt ihn bei `htmx:afterSettle`.
      Die Aufnahme zeigt `aria-pressed="true"` und einen pulsierenden Punkt in
      `--aufmerksamkeit` (ohne Bewegung bei `prefers-reduced-motion`); die Beschriftung
      wechselt zwischen „Diktieren“ und „Diktat beenden“. Es laeuft immer nur ein
      Diktat, Escape beendet es und schliesst nicht zugleich ein Blatt.
    warum: >
      Der Rahmen steht in der Vorlage und nicht im Skript, damit das Feld nicht beim
      Laden umgesetzt wird (das nimmt ihm den Fokus, auch das `autofocus` des Blattes).
      Ohne Erkennung (Firefox) darf nichts Totes auf dem Bildschirm stehen. Ein Knopf in
      der Ecke des Feldes deckt Text zu, sobald das Feld scrollt, und liegt auf dem
      Desktop auf der Bildlaufleiste; darum der Streifen darunter. Wer spricht, muss sehen, dass aufgenommen wird, und es mit dem Daumen
      oder mit Escape beenden koennen.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/statisch/bindung.js
      muster: ['diktat-knopf', 'aria-pressed', 'Diktat beenden', 'verfuegbar\(\)',
               'htmx:afterSettle', '"Escape"']

  - id: diktat-aufnahme-zeigt-sich
    regel: >
      Im Stylesheet hat `.diktat-knopf[aria-pressed="true"]` die Farbe `--aufmerksamkeit`,
      der Punkt pulsiert (`diktat-puls`) und steht bei `prefers-reduced-motion: reduce`
      still; der Knopf ist `var(--ziel)` gross.
    warum: >
      Ein Mikrofon, das offen ist, ohne dass man es sieht, ist das Schlimmste, was ein
      Diktat tun kann. Die Farbe allein genuegt nicht (Farbenblindheit), darum auch der
      Punkt und die Beschriftung.
    pruefung:
      art: datei_enthaelt
      datei: bindung/web/statisch/stil.css
      muster: ['\.diktat-knopf\[aria-pressed="true"\] \{ border-color: var\(--aufmerksamkeit\)',
               'diktat-puls', 'prefers-reduced-motion: reduce', 'width: var\(--ziel\)']

  - id: diktat-sprache-aus-den-einstellungen
    regel: >
      `diktat.js` wird vor `bindung.js` einmal in `basis.html` geladen. Die Sprache
      steht als `data-diktat-sprache` am `<body>` (aus `nutzer.diktat_sprache`, ohne
      Nutzer `de-DE`); der Knopf hat keinen eigenen Umschalter. Die Sprache aendert man
      unter Einstellungen › Diktat und sie gilt ab dem naechsten Laden der Seite.
    warum: >
      Ein Umschalter am Knopf waere ein zweiter Knopf in jedem Feld, auf dem Telefon
      zu eng. Die Sprache wechselt selten; Einstellungen sind von der Seitenleiste aus in zwei Schritten erreicht.
    pruefung:
      art: datei_enthaelt
      dateien: [bindung/web/vorlagen/basis.html]
      muster: ['<script src="/statisch/diktat\.js" defer></script>\s*<script src="/statisch/bindung\.js" defer></script>',
               'data-diktat-sprache="\{\{ nutzer\.diktat_sprache']

  - id: diktat-hinter-einer-schnittstelle
    regel: >
      `diktat.js` hat nach aussen `verfuegbar()`, `starten(feld, sprache)`, `stoppen()`
      und meldet mit den Ereignissen `diktat:start`, `diktat:zwischen`, `diktat:fehler`
      und `diktat:ende` am Feld. Der Anbieter dahinter ist ein Objekt `backend`
      (`verfuegbar`, `starten`), gewaehlt beim Laden. Erkannter Text kommt erst als
      endgueltig ins Feld (mit `input`, am Ende der Sitzung mit `change`); Zwischentext
      steht nur in der Anzeige unter dem Feld.
    warum: >
      Ein Server, der Audio aufnimmt und transkribiert (PLAN.md, Abschnitt 8), soll
      den Browser-Anbieter ersetzen, ohne dass Vorlagen oder Knopf sich aendern.
      Zwischentext im Feld wuerde sich beim Verbessern der Erkennung mitaendern und
      beim Speichern halbe Saetze festhalten; `change` am Ende laesst die Personenseite
      speichern, die erst beim Verlassen des Feldes speichert.
    pruefung:
      art: datei_enthaelt
      dateien: [bindung/web/statisch/diktat.js]
      muster: ['var backend =', 'verfuegbar:', 'starten:', 'stoppen:', 'window\.Diktat =',
               '"diktat:" \+ name', 'new Event\("change"']
