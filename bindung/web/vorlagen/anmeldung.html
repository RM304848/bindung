{% extends "basis.html" %}
{% block titel %}Anmelden · Bindung{% endblock %}
{% block koerper %}seite-anmeldung{% endblock %}
{% block inhalt %}
<main class="anmeldung">
  <h1 class="anmeldung-titel">Bindung</h1>
  <p class="anmeldung-text">Melde dich an, um den Kontakt zu den Menschen zu halten, die dir wichtig sind.</p>
  {% if meldung %}
  <p class="meldung meldung-fehler" role="alert">{{ meldung }}</p>
  {% endif %}
  <form method="post" action="/anmeldung" class="formular">
    <div class="feld">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" value="{{ name or '' }}" autocomplete="username" autocapitalize="none" autofocus required>
    </div>
    <div class="feld">
      <label for="passwort">Passwort</label>
      <input type="password" id="passwort" name="passwort" autocomplete="current-password" required>
    </div>
    <button type="submit" class="knopf knopf-primaer">Anmelden</button>
  </form>
</main>
{% endblock %}
